distributions:
  shared:
    packages:
      - "azure-cli"
      - "bind"
      - "chezmoi"
      - "diff-so-fancy"
      - "docker-buildx"
      - "docker-compose"
      - "dprint"
      - "fastfetch"
      - "flux"
      - "git"
      - "helm"
      - "jq"
      - "k6"
      - "k9s"
      - "kubectl"
      - "kubectx"
      - "luarocks"
      - "make"
      - "nvm"
      - "openssl"
      - "rclone"
      - "ripgrep"
      - "starship"
      - "tilt"
      - "tlrc"
      - "tree-sitter"
      - "yq"
    gitConfig:
      init:
        defaultBranch: "main"
      core:
        autocrlf: "input"
        editor: "nvim"
        eol: "lf"
        longpaths: true
        pager: "diff-so-fancy | less --tabs=4 -RFX"
      pull:
        rebase: false
      gpg:
        format: "ssh"
  windows:
    docker_context: "wsl-ssl-engine"
    scoops:
      - "7zip"
      - "Terminal-Icons"
      - "azure-developer-cli"
      - "azure-functions-core-tools"
      - "azure-kubelogin"
      - "bicep"
      - "bruno"
      - "cacert"
      - "curl"
      - "dark"
      - "dos2unix"
      - "fd"
      - "firefox-developer"
      - "gawk"
      - "gh"
      - "git-credential-manager"
      - "go"
      - "gsudo"
      - "gzip"
      - "hack-nf"
      - "harper"
      - "innounp"
      - "kustomize"
      - "lua"
      - "minikube"
      - "neovim-nightly"
      - "nuget"
      - "openssl"
      - "postgresql"
      - "psmux"
      - "psreadline"
      - "python"
      - "rcedit"
      - "rustup-msvc"
      - "scons"
      - "sed"
      - "scoop-shim-rust"
      - "sqlite"
      - "terraform"
      - "tilt"
      - "unzip"
      - "uv"
      - "vcredist2022"
      - "wget"
    gitConfig:
      core:
        fileMode: false
  darwin:
    brews:
      - "azure-dev"
      - "azurite"
      - "colima"
      - "copa"
      - "cri-tools"
      - "docker"
      - "docker-credential-helper"
      - "dotnet"
      - "eza"
      - "gcc"
      - "hashicorp/tap/terraform"
      - "ripgrep"
      - "shellcheck"
      - "sk"
      - "tree-sitter-cli"
      - "zsh"
    headbrews:
      - "neovim"
      - "rustup"
    casks:
      - "font-fira-code-nerd-font"
      - "font-iosevka"
      - "nikitabobko/tap/aerospace"
      - "obsidian"
      - "signal"
  ubuntu:
    apt:
      - "build-essential"
      - "bubblewrap"
      - "curl"
      - "file"
      - "git"
      - "icu-devtools"
      - "procps"
      - "zsh"
    brews:
      - "azure-dev"
      - "azurite"
      - "copa"
      - "cri-tools"
      - "dotnet"
      - "eza"
      - "hashicorp/tap/terraform"
      - "ripgrep"
      - "shellcheck"
      - "sk"
      - "tree-sitter-cli"
      - "xclip"
    headbrews:
      - "neovim"
      - "rustup"
    curls:
      copilot: "curl -fsSL https://gh.io/copilot-install | bash"
